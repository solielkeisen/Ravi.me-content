name: Notify website to rebuild

on:
  push:
    branches: [main]
    paths:
      - 'attachments/**'
      - 'posts/**'
      - '.github/workflows/notify-website.yml'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch website rebuild
        env:
          WEBSITE_REPO_TOKEN: ${{ secrets.WEBSITE_REPO_TOKEN }}
        run: |
          if [ -z "$WEBSITE_REPO_TOKEN" ]; then
            echo "Set the WEBSITE_REPO_TOKEN Actions secret to enable website rebuilds." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $WEBSITE_REPO_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/solielkeisen/Ravi.me/dispatches \
            -d "{\"event_type\":\"content-updated\",\"client_payload\":{\"sha\":\"$GITHUB_SHA\"}}"
